<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Multa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg:#f6f7f9; --surface:#ffffff; --surface2:#f1f3f6; --border:#e3e7ed;
    --accent:#2f7d5d; --accent2:#2563eb; --success:#1f9d57;
    --warning:#c77d18; --danger:#d64545;
    --text:#1a2230; --text-muted:#5b6675; --text-dim:#97a1b0;
    --shadow-sm:0 1px 2px rgba(20,30,48,.06), 0 1px 3px rgba(20,30,48,.04);
    --shadow-md:0 4px 12px rgba(20,30,48,.08), 0 2px 4px rgba(20,30,48,.04);
    --sans:'IBM Plex Sans',-apple-system,sans-serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:var(--sans); background:var(--bg); color:var(--text);
    display:flex; align-items:flex-start; justify-content:center; min-height:100vh; padding:16px;
  }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:var(--shadow-md); padding:28px; width:100%; max-width:480px;
  }
  h1 { font-size:19px; margin:0 0 4px; }
  p.sub { color:var(--text-muted); font-size:13px; margin:0 0 22px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin:14px 0 5px; }
  input[type=password], input[type=text] {
    width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:9px;
    font-size:14px; font-family:inherit; background:var(--surface2);
  }
  input[type=file] { width:100%; padding:8px 0; font-size:13px; }
  button {
    cursor:pointer; border:none; border-radius:9px; font-weight:600; font-size:14px;
    padding:11px 16px; font-family:inherit;
  }
  .btn-primary { background:var(--accent); color:#fff; width:100%; margin-top:18px; }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-secondary { background:var(--surface2); color:var(--text); border:1.5px solid var(--border); width:100%; margin-top:10px; }
  .btn-small { padding:7px 12px; font-size:12px; }
  .erro { color:var(--danger); font-size:13px; margin-top:10px; min-height:16px; }
  .status { font-size:12px; color:var(--text-muted); margin-top:8px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .resultado-item {
    padding:12px 4px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:2px;
  }
  .resultado-item:last-child { border-bottom:none; }
  .resultado-item .nome { font-weight:600; }
  .resultado-item .meta { font-size:12px; color:var(--text-muted); }
  .hidden { display:none; }
  .aviso { font-size:12px; color:var(--warning); margin-top:6px; }
  .ok-badge { font-size:13px; font-weight:600; color:var(--success); margin-bottom:8px; }
  .multa-card {
    border:1.5px solid var(--border); border-radius:12px; padding:16px; margin-top:14px; background:var(--surface2);
  }
  .multa-card .multa-card-header {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;
  }
  .multa-card .multa-card-tag {
    font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em;
  }
  .multa-card .btn-remover {
    background:transparent; border:none; color:var(--text-dim); font-size:12px; padding:2px 6px; width:auto; margin:0;
  }
  .multa-card .resultado-multa { margin-top:12px; }
</style>
</head>
<body>

<div class="card" id="cardLogin">
  <h1>Consulta de Multa</h1>
  <p class="sub">Acesso restrito só a essa consulta.</p>
  <label for="senha">Senha</label>
  <input type="password" id="senha" autocomplete="current-password">
  <button class="btn-primary" id="btnEntrar">Entrar</button>
  <div class="erro" id="erroLogin"></div>
</div>

<div class="card hidden" id="cardMulta" style="max-width:640px;">
  <h1>Consulta de Multa</h1>
  <p class="sub">Envie o PDF — se tiver mais de uma multa no mesmo arquivo, cada uma vira um card separado. Confira os dados antes de buscar.</p>

  <label for="arquivoPdf">PDF da(s) multa(s)</label>
  <input type="file" id="arquivoPdf" accept="application/pdf">
  <div class="status" id="statusExtracao"></div>

  <div id="listaCards"></div>

  <button class="btn-secondary" id="btnAdicionar" style="margin-top:14px;">+ Adicionar multa manualmente</button>
  <button class="btn-primary" id="btnBuscarTodas">Buscar motorista de todas</button>
  <button class="btn-secondary" id="btnSair">Sair</button>
</div>

<script>
var WORKER_URL = 'https://diarias.aceitacoes.workers.dev';
var processos = [];
var proximoIdCard = 0;

// ── Auth ────────────────────────────────────────────────────────────────
document.getElementById('btnEntrar').addEventListener('click', fazerLogin);
document.getElementById('senha').addEventListener('keydown', function(e){ if (e.key === 'Enter') fazerLogin(); });

function fazerLogin() {
  var senha = document.getElementById('senha').value;
  var erro = document.getElementById('erroLogin');
  erro.textContent = '';
  if (!senha) { erro.textContent = 'Informe a senha.'; return; }

  fetch(WORKER_URL + '?action=multa-carregar', { headers: { 'X-Multa-Pass': senha } })
    .then(function(r) {
      if (r.status === 401) throw new Error('Senha incorreta.');
      if (!r.ok) throw new Error('Falha ao conectar (HTTP ' + r.status + ').');
      return r.json();
    })
    .then(function(data) {
      processos = data.processos || [];
      // Senha só fica em memória pra essa aba — nunca salva em disco/localStorage.
      document.getElementById('cardLogin').classList.add('hidden');
      document.getElementById('cardMulta').classList.remove('hidden');
      adicionarCard('', '', '', '');
    })
    .catch(function(e) { erro.textContent = e.message; });
}

document.getElementById('btnSair').addEventListener('click', function() {
  processos = [];
  document.getElementById('senha').value = '';
  document.getElementById('listaCards').innerHTML = '';
  document.getElementById('statusExtracao').textContent = '';
  document.getElementById('cardMulta').classList.add('hidden');
  document.getElementById('cardLogin').classList.remove('hidden');
});

// ── Cards (um por multa — placa/data/hora editáveis + resultado da busca) ─
function adicionarCard(placa, data, hora, tag, numeroAuto) {
  var id = 'card' + (proximoIdCard++);
  var div = document.createElement('div');
  div.className = 'multa-card';
  div.dataset.cardId = id;
  div.dataset.numeroAuto = numeroAuto || '';
  div.innerHTML =
      '<div class="multa-card-header">'
    + '<span class="multa-card-tag">' + (tag || 'Manual') + '</span>'
    + '<button class="btn-remover" data-acao="remover">✕ remover</button>'
    + '</div>'
    + '<div class="grid2">'
    + '<div><label>Placa</label><input type="text" class="in-placa" placeholder="ABC1234" value="' + (placa || '') + '"></div>'
    + '<div><label>Data (DD/MM/AAAA)</label><input type="text" class="in-data" placeholder="24/08/2026" value="' + (data || '') + '"></div>'
    + '</div>'
    + '<label>Hora (HH:MM) — opcional, ajuda a reduzir a lista</label>'
    + '<input type="text" class="in-hora" placeholder="14:30" value="' + (hora || '') + '">'
    + (numeroAuto ? '<div class="status" style="margin-top:4px;">Auto de infração nº ' + numeroAuto + '</div>' : '')
    + '<button class="btn-primary btn-small" data-acao="buscar" style="margin-top:10px;">Buscar essa</button>'
    + '<div class="resultado-multa"></div>';
  document.getElementById('listaCards').appendChild(div);
  return div;
}

document.getElementById('btnAdicionar').addEventListener('click', function() { adicionarCard('', '', '', 'Manual'); });

document.getElementById('listaCards').addEventListener('click', function(e) {
  var acao = e.target.dataset.acao;
  if (!acao) return;
  var cardEl = e.target.closest('.multa-card');
  if (acao === 'remover') { cardEl.remove(); return; }
  if (acao === 'buscar') { buscarNoCard(cardEl); return; }
  if (acao === 'termo') {
    var idx = Number(e.target.dataset.idx);
    var processo = (cardEl._achadosAtual || [])[idx];
    if (!processo) return;
    gerarTermoPDF(processo, {
      placa: cardEl.querySelector('.in-placa').value.trim(),
      data: cardEl.querySelector('.in-data').value.trim(),
      hora: cardEl.querySelector('.in-hora').value.trim(),
      numeroAuto: cardEl.dataset.numeroAuto || '',
    });
  }
});

document.getElementById('btnBuscarTodas').addEventListener('click', function() {
  document.querySelectorAll('.multa-card').forEach(function(cardEl) { buscarNoCard(cardEl); });
});

// ── Extração do PDF (mesmo padrão já usado no site principal: pdf.js lê o
// texto real do PDF, sem OCR de imagem — os autos de infração daqui são
// gerados digitalmente, não escaneados) — passa por TODAS as páginas, já
// que uma notificação em lote costuma trazer uma multa por página. ───────
function normalizarPlaca(p) {
  return String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
}
function normalizarHoraMulta(h) {
  var s = String(h || '').replace(/[^0-9]/g, '');
  if (!s) return '';
  if (s.length <= 2) return s.padStart(2, '0') + ':00';
  s = s.padStart(4, '0').slice(0, 4);
  var hh = s.slice(0, 2), mm = s.slice(2, 4);
  if (Number(hh) > 23 || Number(mm) > 59) return '';
  return hh + ':' + mm;
}
function extrairCamposDoTexto(texto) {
  var placaM = texto.match(/PLACA[:\s\/A-Z]*?([A-Z]{3}[-\s]?[0-9][A-Z0-9][0-9]{2})/i);
  var dataM = texto.match(/DATA(?:\s+DA\s+INFRA[ÇC][ÃA]O)?[:\s]*([0-3]?[0-9]\/[0-1]?[0-9]\/[0-9]{2,4})/i);
  // "HOR[ÁA](?:RIO)?" casa tanto "Hora" quanto "Horário" — achado real, 27/08/2026,
  // testando contra uma multa da PRF de verdade: o rótulo lá é só "Hora", e a versão
  // anterior exigia "Horário"/"Horario" completo (RI obrigatório), então nunca batia.
  var horaM = texto.match(/HOR[ÁA](?:RIO)?(?:\s+DA\s+INFRA[ÇC][ÃA]O)?[:\s]*([0-2]?[0-9][:h][0-5][0-9])/i);
  var autoM = texto.match(/Auto de infra[çc][ãa]o\s*n[ºo°]?\s*([A-Z]?[0-9][0-9.\-]{5,})/i);
  return {
    placa: placaM ? normalizarPlaca(placaM[1]) : '',
    data: dataM ? dataM[1] : '',
    hora: horaM ? normalizarHoraMulta(horaM[1]) : '',
    numeroAuto: autoM ? autoM[1] : '',
    achouAlgo: !!(placaM || dataM || horaM),
  };
}

document.getElementById('arquivoPdf').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var status = document.getElementById('statusExtracao');
  status.textContent = 'Lendo PDF...';
  status.style.color = 'var(--text-muted)';

  var reader = new FileReader();
  reader.onload = function(ev) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    pdfjsLib.getDocument({ data: ev.target.result }).promise.then(function(pdf) {
      var promessasPaginas = [];
      for (var n = 1; n <= pdf.numPages; n++) {
        promessasPaginas.push(
          pdf.getPage(n).then(function(page) { return page.getTextContent(); })
            .then(function(tc) { return tc.items.map(function(i) { return i.str; }).join(' '); })
        );
      }
      return Promise.all(promessasPaginas);
    }).then(function(textosPorPagina) {
      // Limpa os cards em branco de antes de subir o arquivo (mas não os que já tinham
      // busca feita — só substitui os vazios, pra não perder trabalho já feito).
      document.querySelectorAll('.multa-card').forEach(function(el) {
        var vazio = !el.querySelector('.in-placa').value && !el.querySelector('.in-data').value;
        if (vazio) el.remove();
      });

      var encontradas = 0;
      textosPorPagina.forEach(function(texto, i) {
        var campos = extrairCamposDoTexto(texto);
        if (!campos.achouAlgo) return; // página sem nada reconhecível (ex: verso em branco) — pula
        encontradas++;
        var tag = textosPorPagina.length > 1 ? 'Página ' + (i + 1) : 'PDF';
        adicionarCard(campos.placa, campos.data, campos.hora, tag, campos.numeroAuto);
      });

      if (encontradas === 0) {
        status.textContent = '⚠️ Não consegui extrair nada automaticamente. Preencha manualmente.';
        status.style.color = 'var(--warning)';
        if (!document.querySelector('.multa-card')) adicionarCard('', '', '', 'Manual');
      } else {
        status.textContent = '✅ ' + encontradas + ' multa(s) encontrada(s) — confira os dados antes de buscar.';
        status.style.color = 'var(--success)';
      }
    }).catch(function(e) {
      status.textContent = '❌ Erro ao ler PDF: ' + e.message;
      status.style.color = 'var(--danger)';
    });
  };
  reader.readAsArrayBuffer(file);
});

// ── Busca (mesma lógica de correspondência do site principal, sem edição —
// essa tela só encontra, nunca modifica nenhum processo) ─────────────────
function brParaISO(br) {
  if (!br) return '';
  var p = br.split('/');
  if (p.length < 3) return '2026-' + p[1].padStart(2, '0') + '-' + p[0].padStart(2, '0');
  var ano = p[2].length === 2 ? '20' + p[2] : p[2];
  return ano + '-' + p[1].padStart(2, '0') + '-' + p[0].padStart(2, '0');
}
function horasDoProcesso(p) {
  var out = { saida: normalizarHoraMulta(p.horaSaida) || '', chegada: normalizarHoraMulta(p.horaChegada) || '' };
  if (out.saida && out.chegada) return out;
  var d = String(p.descricao || '');
  if (!d) return out;
  var dn = d.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  if (!out.saida) {
    var ms = dn.match(/HORA DE SAIDA:\s*(\d{1,2})[:H](\d{2})/);
    if (ms) out.saida = ms[1].padStart(2, '0') + ':' + ms[2];
  }
  if (!out.chegada) {
    var mc = dn.match(/HORA DE CHEGADA:\s*(\d{1,2})[:H](\d{2})/);
    if (mc) out.chegada = mc[1].padStart(2, '0') + ':' + mc[2];
  }
  return out;
}

function buscarNoCard(cardEl) {
  var placa = normalizarPlaca(cardEl.querySelector('.in-placa').value);
  var dataTxt = cardEl.querySelector('.in-data').value.trim();
  var horaTxt = cardEl.querySelector('.in-hora').value.trim();
  var box = cardEl.querySelector('.resultado-multa');

  if (!placa && !dataTxt) { box.innerHTML = '<p style="color:var(--danger);font-size:13px;margin:0;">Informe ao menos a placa ou a data.</p>'; return; }

  var alvoISO = dataTxt ? brParaISO(dataTxt) : '';
  if (dataTxt && (!alvoISO || alvoISO.length < 10)) {
    box.innerHTML = '<p style="color:var(--danger);font-size:13px;margin:0;">Data inválida. Use DD/MM/AAAA.</p>';
    return;
  }
  var horaAlvo = horaTxt ? normalizarHoraMulta(horaTxt) : '';

  var alvoIni = alvoISO ? alvoISO + 'T' + (horaAlvo || '00:00') : '';
  var alvoFim = alvoISO ? alvoISO + 'T' + (horaAlvo || '23:59') : '';
  var semHorario = 0;

  var achados = processos.filter(function(p) {
    if (placa && normalizarPlaca(p.placa).indexOf(placa) === -1) return false;
    if (!alvoISO) return true;
    var iniD = p.dataSaida ? brParaISO(p.dataSaida) : '';
    if (!iniD) return false;
    var fimD = p.dataChegada ? brParaISO(p.dataChegada) : iniD;
    if (fimD < iniD) fimD = iniD;
    var dias = (new Date(fimD + 'T00:00') - new Date(iniD + 'T00:00')) / 86400000;
    if (dias > 30) fimD = iniD;

    var hp = horasDoProcesso(p);
    var hIni = hp.saida || '00:00';
    var hFim = hp.chegada || '23:59';
    if (horaAlvo && (!hp.saida || !hp.chegada)) semHorario++;

    var viagemIni = iniD + 'T' + hIni;
    var viagemFim = fimD + 'T' + hFim;
    if (viagemFim < viagemIni) viagemFim = fimD + 'T23:59';

    return alvoIni <= viagemFim && alvoFim >= viagemIni;
  });

  if (achados.length === 0) {
    box.innerHTML = '<div style="padding:10px;background:var(--surface);border-radius:8px;font-size:13px;">'
      + '<strong>Nenhuma viagem encontrada.</strong> Só aparecem aqui viagens que geraram diária.</div>';
    return;
  }

  achados.sort(function(a, b) { return brParaISO(a.dataSaida || '').localeCompare(brParaISO(b.dataSaida || '')); });
  cardEl._achadosAtual = achados; // pro clique em "Gerar termo" achar o processo certo por índice

  var titulo = achados.length === 1
    ? '<div class="ok-badge">✅ Um único motorista estava com o veículo:</div>'
    : '<div style="font-size:13px;font-weight:600;margin-bottom:8px;">' + achados.length + ' viagens cobrem esse momento:</div>';

  box.innerHTML = titulo + achados.map(function(p, idx) {
    var periodo = (p.dataSaida || '?') + (p.dataChegada && p.dataChegada !== p.dataSaida ? ' até ' + p.dataChegada : '');
    var hpr = horasDoProcesso(p);
    var horas = (hpr.saida || hpr.chegada) ? (hpr.saida || '?') + ' → ' + (hpr.chegada || '?') : 'sem horário na descrição';
    return '<div class="resultado-item">'
      + '<div class="nome">' + (p.servidor || '(sem nome)') + '</div>'
      + '<div class="meta">🚗 ' + (p.placa || '—') + ' · 📍 ' + (p.cidade || '—') + '</div>'
      + '<div class="meta">📅 ' + periodo + ' · 🕐 ' + horas + '</div>'
      + (p.numProcesso ? '<div class="meta">📄 Processo ' + p.numProcesso
          + (p.hash1doc ? ' — <a href="https://tupancireta.1doc.com.br/?pg=doc/ver&hash=' + p.hash1doc + '&itd=7" target="_blank" rel="noopener">🔗 Abrir no 1Doc</a>' : '')
          + '</div>' : '')
      + '<button class="btn-secondary btn-small" style="width:auto;margin-top:8px;" data-acao="termo" data-idx="' + idx + '">📄 Gerar termo pra assinar</button>'
      + '</div>';
  }).join('')
  + (achados.length > 1 && !horaAlvo ? '<p class="aviso">💡 Informe a hora da multa pra reduzir a lista.</p>' : '')
  + (semHorario > 0 && horaAlvo ? '<p class="aviso">⚠️ ' + semHorario + ' viagem(ns) sem horário completo — consideradas o dia inteiro.</p>' : '');
}

// ── Termo de ciência + autorização de desconto em folha ──────────────────
// Texto padrão simples — não é parecer jurídico. Revisar redação com o RH antes de usar
// em produção pra valer, principalmente a parte de autorização de desconto (impacta
// folha de pagamento de servidor público).
function gerarTermoPDF(processo, dadosMulta) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit: 'mm', format: 'a4' });
  var margem = 20;
  var largura = 210 - margem * 2;
  var y = 22;

  function linha(texto, opts) {
    opts = opts || {};
    doc.setFontSize(opts.tamanho || 11);
    doc.setFont('helvetica', opts.negrito ? 'bold' : 'normal');
    var quebradas = doc.splitTextToSize(texto, largura);
    doc.text(quebradas, margem, y, { align: opts.centro ? 'center' : 'left' });
    y += quebradas.length * (opts.altura || 6) + (opts.espacoDepois || 0);
  }

  linha('PREFEITURA MUNICIPAL DE TUPANCIRETÃ', { negrito: true, tamanho: 12, centro: true });
  linha('SECRETARIA MUNICIPAL DE SAÚDE', { tamanho: 10, centro: true, espacoDepois: 8 });
  linha('TERMO DE CIÊNCIA DE INFRAÇÃO DE TRÂNSITO E', { negrito: true, tamanho: 13, centro: true });
  linha('AUTORIZAÇÃO DE DESCONTO EM FOLHA DE PAGAMENTO', { negrito: true, tamanho: 13, centro: true, espacoDepois: 10 });

  linha(
    'Pelo presente termo, eu, ' + (processo.servidor || '_______________________________') + ', ' +
    'servidor(a)/motorista lotado(a) na Secretaria Municipal de Saúde, portador(a) do CPF ' +
    'nº ______________________, declaro estar ciente da infração de trânsito abaixo identificada, ' +
    'ocorrida durante o uso do veículo oficial no exercício de minhas funções, e AUTORIZO o desconto ' +
    'do valor correspondente diretamente em minha folha de pagamento, nos termos definidos pelo ' +
    'Departamento de Recursos Humanos desta Prefeitura.',
    { espacoDepois: 8 }
  );

  linha('DADOS DA INFRAÇÃO', { negrito: true, espacoDepois: 2 });
  linha('Veículo (placa): ' + (dadosMulta.placa || processo.placa || '—'));
  linha('Data da infração: ' + (dadosMulta.data || '—') + (dadosMulta.hora ? '   Hora: ' + dadosMulta.hora : ''));
  if (dadosMulta.numeroAuto) linha('Auto de Infração nº: ' + dadosMulta.numeroAuto);
  linha('Valor da multa: R$ ______________________ (a preencher conforme boleto/notificação)', { espacoDepois: 8 });

  linha('DADOS DA VIAGEM RELACIONADA (SGD)', { negrito: true, espacoDepois: 2 });
  linha('Destino: ' + (processo.cidade || '—'));
  linha('Período: ' + (processo.dataSaida || '—') + (processo.dataChegada && processo.dataChegada !== processo.dataSaida ? ' até ' + processo.dataChegada : ''));
  if (processo.numProcesso) linha('Processo (1Doc): ' + processo.numProcesso, { espacoDepois: 8 });
  else y += 8;

  linha(
    'Declaro que as informações acima são verdadeiras e que fui devidamente notificado(a) sobre ' +
    'a infração cometida, não me opondo ao desconto autorizado neste termo.',
    { espacoDepois: 16 }
  );

  linha('Tupanciretã/RS, ____ de _______________________ de 2026.', { espacoDepois: 20 });

  linha('_______________________________________________', { centro: true });
  linha(processo.servidor || 'Assinatura do(a) servidor(a)', { centro: true, espacoDepois: 10 });

  linha('_______________________________________________', { centro: true });
  linha('Recebido pelo RH — Prefeitura Municipal de Tupanciretã', { centro: true });

  var nomeArquivo = 'termo_multa_' + (processo.servidor || 'servidor').replace(/\s+/g, '_').toLowerCase() + '.pdf';
  doc.save(nomeArquivo);
}
</script>
